services:
  # -------------------------------------------------------------
  # Chakravyuha CTF Frontend (Static Site on Render)
  # -------------------------------------------------------------
  - type: web
    name: chakravyuha-ui
    runtime: static
    rootDir: ui
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  # -------------------------------------------------------------
  # Scoring & Verification API Service
  # -------------------------------------------------------------
  - type: web
    name: chakravyuha-scoring
    runtime: python
    rootDir: scoring
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT_SCORING
        value: 8000
