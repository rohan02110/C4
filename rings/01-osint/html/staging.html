<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VYUHA Staging Ingress — Subdomain Gateway</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #08080d; color: #f1f5f9; margin: 0; padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 80vh; }
        .card { background: #11111a; border: 1px solid #1f1f2e; border-radius: 12px; padding: 32px; width: 460px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        h1 { color: #38bdf8; font-size: 20px; margin-top: 0; }
        .tag { display: inline-block; background: #0369a1; color: white; font-size: 10px; font-weight: bold; padding: 2px 8px; border-radius: 4px; margin-bottom: 12px; }
        input { width: 100%; box-sizing: border-box; background: #181824; border: 1px solid #2e2e42; color: white; padding: 10px; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
        button { width: 100%; background: #38bdf8; border: none; color: black; font-weight: bold; padding: 12px; border-radius: 6px; cursor: pointer; }
        .flag-box { display: none; margin-top: 20px; padding: 16px; background: #064e3b; border: 1px solid #059669; border-radius: 8px; }
        .flag-box code { color: #34d399; font-weight: bold; font-size: 13px; word-break: break-all; }
    </style>
</head>
<body>
    <div class="card">
        <span class="tag">INTERNAL STAGING INGRESS</span>
        <h1>VYUHA STAGING PORTAL</h1>
        <p style="font-size: 12px; color: #94a3b8; margin-top: 0;">Authorized QA and System Analysts Only</p>
        
        <form id="stagingForm" onsubmit="handleLogin(event)">
            <label style="font-size: 12px; color: #94a3b8;">Analyst Username</label>
            <input type="text" id="username" placeholder="analyst_sd" required>
            <label style="font-size: 12px; color: #94a3b8;">Access Password</label>
            <input type="password" id="password" placeholder="••••••••••••" required>
            <button type="submit">Authenticate To Staging</button>
        </form>

        <div id="flagBox" class="flag-box">
            <div style="font-size: 11px; color: #a7f3d0; text-transform: uppercase; font-weight: bold; margin-bottom: 4px;">
                [+] Jayadratha's Gate Bypassed — Intermediate Token:
            </div>
            <code>JAYADRATHA_GATE_BYPASS_9a8f27c3e510</code>
            <p style="font-size: 12px; color: #e2e8f0; margin-top: 10px; margin-bottom: 0;">
                Next Hop: Proceed to Ring 2 Web Application (Kripacharya's Portal) on port <code>8082</code> with analyst credentials.
            </p>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById("username").value.trim();
            const p = document.getElementById("password").value.trim();
            if (u === "analyst_sd" && p === "indra2023!") {
                document.getElementById("flagBox").style.display = "block";
            } else {
                alert("Invalid staging analyst credentials. Check architect field notes.");
            }
        }
    </script>
</body>
</html>
