server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Staging portal endpoint
    location /staging {
        try_files /staging.html =404;
    }

    # Architect blog endpoint
    location /architect {
        try_files /blog.html =404;
    }
}
