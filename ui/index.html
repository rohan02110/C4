<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='none' stroke='%23f59e0b' stroke-width='4'/><circle cx='50' cy='50' r='30' fill='none' stroke='%23ef4444' stroke-width='3'/><circle cx='50' cy='50' r='15' fill='none' stroke='%23eab308' stroke-width='2'/><circle cx='50' cy='50' r='5' fill='%23f59e0b'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CHAKRAVYUHA — CTF Portal</title>
    <meta name="description" content="Chakravyuha CTF Portal" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
      // Disable right-click & DevTools shortcuts
      document.addEventListener("contextmenu", function(e) { e.preventDefault(); return false; });
      document.addEventListener("keydown", function(e) {
        if (e.keyCode === 123) { e.preventDefault(); return false; } // F12
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === "I" || e.key === "i" || e.key === "J" || e.key === "j" || e.key === "C" || e.key === "c")) { e.preventDefault(); return false; }
        if ((e.ctrlKey || e.metaKey) && (e.key === "u" || e.key === "U" || e.key === "s" || e.key === "S")) { e.preventDefault(); return false; }
      });
    </script>
  </head>
  <body class="bg-neutral-950 text-neutral-100 selection:bg-amber-500 selection:text-black overflow-x-hidden antialiased select-none" oncontextmenu="return false;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
